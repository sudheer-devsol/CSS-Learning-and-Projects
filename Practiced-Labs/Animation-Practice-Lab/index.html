<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .Animate{
            height: 100px;
            width: 100px;
            background-color: blue;
            color: whitesmoke;
            border-radius: 10px;
            position: absolute;
            left: 60px;
            margin-top: 60px;
            border: 2px solid black;
           
            /* animation-name: Ghumakad;
            animation-duration: 1s;
            animation-delay: 0s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction:alternate; */

            /* Animation combine prperties */
            animation: Ghumakad 1s ease-in-out 0s infinite alternate;

        }

        .Animate1{
            height: 100px;
            width: 100px;
            background-color: blue;
            color: whitesmoke;
            border-radius: 10px;
            position: absolute;
            left: 200px;
            margin-top: 200px;
            border: 2px solid black;
           
            /* animation-name: Ghumakad;
            animation-duration: 1s;
            animation-delay: 0s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction:alternate; */

            /* Animation combine prperties */
            animation: Feroo 1s ease-in-out 0s infinite alternate;

        }
        .Angular{
            height: 100px;
            width: 100px;
            background-color: blue;
            color: whitesmoke;
            border-radius: 10px;
            position: absolute;
            left: 10px;
            margin-top: 10px;
            border: 2px solid black;
           
            /* animation-name: Ghumakad;
            animation-duration: 1s;
            animation-delay: 0s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
            animation-direction:alternate; */

            /* Animation combine prperties */
            animation: Angular 3s ease-in-out 0s infinite alternate;

        }
        @keyframes Ghumakad {
                form{
                    left: 60px;
                }
                to{
                    left: 250px;
                }
        }
        @keyframes Feroo {
                
                0%{left: 10px;}
                50%{left: 50px;}
                60%{left: 160px;}
                100%{left: 200px;}
            
    }

    @keyframes Angular {
                
                0%{left: 10px; top:10px}
                50%{left: 150px; top:80px}
                60%{left: 700px; top:10px}
                  
    }
    </style>
</head>
<body>
    <div class="Animate">Animation</div>
    <hr>
    <div class="Animate1">Animation</div>
    <div class="Angular">Animation</div>
</body>
</html>
