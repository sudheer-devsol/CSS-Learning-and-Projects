<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0; padding: 0;
        }
        nav{
            background: lightgreen;
            color: brown;
            font-size: 22px;
        }
        nav a{
            padding: 5px;
            color: brown;
            text-decoration: none;
            margin-left: 30PX;
        }
        .container{
            margin-top: 20px;
            background: gray;
            border: red solid 3px;
            height: 400px;
            width: 600px;
            display: flex;
            flex-direction: row-reverse;
        }
        .box{
            background: greenyellow;
            color: brown;
            height: 60px;
            width: 60px;

            margin: 10px;
        
        }
        h1{
            text-align: center;
            text-transform: uppercase;
            text-decoration: underline;
        }
        .container2{
            margin-top: 20px;
            background: gray;
            border: red solid 3px;
            height: 400px;
            width: 600px;
            display: flex;
            flex-direction: column-reverse;
        }
        .box1{
            background: greenyellow;
            color: brown;
            height: 50px;
            width: 50px;
            margin: 10px;
        
        }
        .container3{
            margin-top: 20px;
            background: gray;
            border: red solid 3px;
            height: 400px;
            width: 600px;
            display: flex;
            justify-content: flex-end;
            
        }
        .box2{
            background: greenyellow;
            color: brown;
            height: 50px;
            width: 50px;
            margin: 10px;
        
        }
        .container4{
            margin-top: 20px;
            background: gray;
            border: red solid 3px;
            height: 400px;
            width: 600px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            
        }
        .box3{
            background: greenyellow;
            color: brown;
            height: 50px;
            width: 50px;
            margin: 10px;
        }
    </style>
</head>
<body>
    <header >
        <nav class="navigation">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
            <a href="#">Help</a>
        </nav>
    </header>
    <main>
        <h1>Row Flex</h1>
        <Section>
            <div class="container">
                <div id="item1" class="box"></div>
                <div id="item2" class="box"></div>
                <div id="item3" class="box"></div>
                <div id="item4" class="box"></div>
            </div>
        </Section>
        <h1>Column Flex</h1>
        <Section>
            <div class="container2">
                <div id="item1" class="box1"></div>
                <div id="item2" class="box1"></div>
                <div id="item3" class="box1"></div>
                <div id="item4" class="box1"></div>
            </div>
        </Section>

        <h1>Flex Properties</h1>
        <Section>
            <div class="container3">
                <div id="item1" class="box2"></div>
                <div id="item2" class="box2"></div>
                <div id="item3" class="box2"></div>
                <div id="item4" class="box2"></div>
            </div>
        </Section>

        <h1>Flex Properties</h1>
        <Section>
            <div class="container4">
                <div id="item1" class="box3">item1</div>
                <div id="item2" class="box3">item2</div>
                <div id="item3" class="box3">item3</div>
                <div id="item4" class="box3">item4</div>
            </div>
        </Section>


    </main>
    <footer>

    </footer>
</body>
</html>
